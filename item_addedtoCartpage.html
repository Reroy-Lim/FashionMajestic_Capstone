<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Item Added</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #fafafa;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: black;
      border: 3px solid blueviolet;
      display: inline-block;
      padding: 10px 20px;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 22px;
      color: #333;
    }

    .products {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .product {
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      background-color: white;
      width: 180px;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }

    .stars {
      color: gold;
    }

    .desc {
      margin-top: 5px;
      font-size: 14px;
      color: #444;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      max-width: 600px;
      margin: 0 auto;
    }

    .btn {
      background-color: #6c90d8;
      color: white;
      padding: 12px 25px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #5579c1;
    }
  </style>
</head>
<body>

  <h1>Item successfully added to cart!</h1>
  <h2>Items to complete your new look:</h2>

  <div class="products">
    <div class="product">
      <img src="https://i.imgur.com/v1xqWcG.png" alt="Plain White Shorts">
      <div class="price">$15.00 <span class="stars">★★★★★</span></div>
      <div class="desc">Plain White Shorts</div>
    </div>

    <div class="product">
      <img src="https://i.imgur.com/gxjVdUe.png" alt="Beige Linen Women Shorts">
      <div class="price">$18.00 <span class="stars">★★★★★</span></div>
      <div class="desc">beige linen women shorts</div>
    </div>

    <div class="product">
      <img src="https://i.imgur.com/yP4Dtfu.png" alt="Wide Leg Trousers">
      <div class="price">$20.00 <span class="stars">★★★★☆</span></div>
      <div class="desc">Style Linen<br>Wide Leg Trouser Pants</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn">Back to Home</button>
    <button class="btn">Check Out</button>
  </div>

</body>
</html>
