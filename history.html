<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order History - MajestiVision</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e7f5f6;
      margin: 0;
      padding: 20px;
    }
    h1.title {
      text-align: center;
      font-size: 36px;
      color: #2d4564;
    }
    .history-container {
      max-width: 1050px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .order {
      border-bottom: 1px solid #ccc;
      margin-bottom: 20px;
      padding-bottom: 15px;
    }
    .order h3 {
      margin-bottom: 10px;
      color: #5d88c1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f9f9f9;
    }
    .btn {
      background-color: #5d88c1;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
      display: inline-block;
    }
    .btn:hover {
      background-color: #4c70a2;
    }
  </style>
</head>
<body>

  <h1 class="title">Order History</h1>

  <div class="history-container" id="history-container">
    <!-- Orders will be rendered here -->
  </div>

  <div style="text-align:center; margin-top: 20px;">
    <button class="btn" onclick="window.location.href='/menu'">Back to Menu</button>
  </div>

  <script>
    function renderHistory() {
      const historyContainer = document.getElementById("history-container");
      const orderHistory = JSON.parse(localStorage.getItem("orderHistory")) || [];

      if (orderHistory.length === 0) {
        historyContainer.innerHTML = "<p>No past orders found.</p>";
        return;
      }

      historyContainer.innerHTML = "";
      orderHistory.reverse().forEach((order, index) => {
        const orderDiv = document.createElement("div");
        orderDiv.className = "order";
        orderDiv.innerHTML = `
          <h3>Order #${orderHistory.length - index} - ${order.date}</h3>
          <p><strong>Payment Method:</strong> ${order.paymentMethod}</p>
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Unit Price</th>
                <th>Quantity</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              ${order.items.map(item => `
                <tr>
                  <td>${item.name} - ${item.size} - ${item.color}</td>
                  <td>$${item.price.toFixed(2)}</td>
                  <td>${item.quantity}</td>
                  <td>$${(item.price * item.quantity).toFixed(2)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        historyContainer.appendChild(orderDiv);
      });
    }

    // Render order history on page load
    renderHistory();
  </script>

</body>
</html>
