<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MajestiVision</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f6eada;
        }

        .browser-header {
            background-color: #e083a5;
            padding: 10px;
            display: flex;
            align-items: center;
        }

        .tab-bar {
            display: flex;
            align-items: center;
        }

        .tab {
            background-color: #d4cba1; /* Updated color */
            color: white;
            padding: 8px 15px;
            border-radius: 5px 5px 0 0;
            display: flex;
            align-items: center;
            margin-right: 5px;
        }

        .tab-text {
            margin-right: 10px;
        }

        .close-button {
            font-weight: bold;
            cursor: pointer;
        }

        .new-tab {
            font-size: 20px;
            font-weight: bold;
            margin-left: 5px;
            cursor: pointer;
        }

        .browser-controls {
            display: flex;
            align-items: center;
            padding: 8px;
            background-color: #f5e9cf;
        }

        .nav-buttons {
            display: flex;
            margin-right: 10px;
        }

        .nav-button {
            font-size: 18px;
            margin: 0 5px;
            cursor: pointer;
        }

        .url-bar {
            background-color: #ffc09e;
            border-radius: 20px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .search-icon {
            margin-right: 10px;
        }

        .url-text {
            font-weight: bold;
        }

        .content {
            background-color: #e8f9f9;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-text {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 30px;
        }

        .logo img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
        }

        .button {
            border: none;
            border-radius: 25px;
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            color: white;
        }
        
        .login-button {
            background-color: #2ecc71; /* Green color for Login */
        }
        
        .signup-button {
            background-color: #9b59b6; /* Muted Purple-Grey for Sign up */
        }
    </style>
</head>
<body>
    <div class="browser-controls">
        <div class="nav-buttons">
            <span class="nav-button">←</span>
            <span class="nav-button">→</span>
            <span class="nav-button">⟳</span>
        </div>
        
    </div>

    <div class="content">
        <div class="welcome-text">WELCOME TO</div>

        <div class="logo">
            <img src="MajestiVision logo.jpeg" alt="MajestiVision Logo">
        </div>

        <div class="buttons-container">
            <a href="Login.html" class="button login-button">LOGIN</a>
            <a href="Sign-up.html" class="button signup-button">SIGN UP</a>

        </div>
    </div>
</body>
</html>
