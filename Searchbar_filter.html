<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Filters</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #d2d2d2b7;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    .filters-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .filter-section,
    .price-range {
      flex: 1 1 calc(33.333% - 30px);
      max-width: calc(33.333% - 30px);
      border: 2px solid black;
      border-radius: 10px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      box-sizing: border-box;
      text-align: left;
      background-color: white;
    }

    .filter-section strong,
    .price-range strong {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .filter-section label,
    .rating-stars label {
      display: flex;
      align-items: center;
      margin: 6px 0;
      font-size: 15px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    select {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .rating-stars .star {
      color: gold;
      margin-right: 5px;
      font-size: 16px;
    }

    .rating-stars label {
      justify-content: space-between;
    }

    .btn-container {
      margin-top: 30px;
    }

    button {
      background-color: #5d84c4;
      color: rgb(224, 217, 217);
      font-size: 18px;
      padding: 10px 30px;
      border: none;
      border-radius: 5px;
      margin: 0 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3e65a0;
    }

    .success-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #4CAF50;
      color: white;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .success-message.show {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body>

<h1>Search Filters</h1>

<div class="filters-wrapper">

  <!-- Type of Clothing -->
  <div class="filter-section">
    <strong>Type of Clothing:</strong>
    <label><input type="checkbox"> T-Shirt</label>
    <label><input type="checkbox"> Long Pants</label>
    <label><input type="checkbox"> Shorts</label>
    <label><input type="checkbox"> Dress</label>
  </div>

  <!-- Made In -->
  <div class="filter-section">
    <strong>Made in:</strong>
    <label><input type="checkbox"> Singapore</label>
    <label><input type="checkbox"> United States</label>
    <label><input type="checkbox"> United Kingdom</label>
    <label><input type="checkbox"> Vietnam</label>
    <label><input type="checkbox"> China</label>
  </div>

  <!-- Price Range -->
  <div class="price-range">
    <strong>Price Range:</strong>
    <label for="min-price">Min Price:</label>
    <select id="min-price">
      <option>$30</option>
      <option>$50</option>
      <option>$100</option>
      <option>$150</option>
    </select>

    <label for="max-price">Max Price:</label>
    <select id="max-price">
      <option>$150</option>
      <option>$200</option>
      <option>$250</option>
      <option>$300</option>
    </select>
  </div>

  <!-- Ratings -->
  <div class="filter-section rating-stars">
    <strong>Ratings:</strong>
    <label><span class="star">⭐⭐⭐⭐⭐</span><input type="checkbox"></label>
    <label><span class="star">⭐⭐⭐⭐</span><input type="checkbox"></label>
    <label><span class="star">⭐⭐⭐</span><input type="checkbox"></label>
    <label><span class="star">⭐⭐</span><input type="checkbox"></label>
    <label><span class="star">⭐</span><input type="checkbox"></label>
  </div>

  <!-- Color -->
  <div class="filter-section">
    <strong>Color:</strong>
    <label><input type="checkbox"> Beige</label>
    <label><input type="checkbox"> Black</label>
    <label><input type="checkbox"> Blue</label>
    <label><input type="checkbox"> Brown</label>
    <label><input type="checkbox"> Burgundy</label>
    <label><input type="checkbox"> Navy Blue</label>
    <label><input type="checkbox"> Grey</label>
    <label><input type="checkbox"> Green</label>
    <label><input type="checkbox"> Purple</label>
    <label><input type="checkbox"> White</label>
    <label><input type="checkbox"> Charcoal</label>
    <label><input type="checkbox"> Coffee Brown</label>
    <label><input type="checkbox"> Cream</label>
    <label><input type="checkbox"> Fluorescent Green</label>
    <label><input type="checkbox"> Grey Melange</label>
    <label><input type="checkbox"> Khaki</label>
    <label><input type="checkbox"> Lavender</label>
    <label><input type="checkbox"> Lime Green</label>
    <label><input type="checkbox"> Magenta</label>
    <label><input type="checkbox"> Maroon</label>
    <label><input type="checkbox"> Mauve</label>
    <label><input type="checkbox"> Multi</label>
    <label><input type="checkbox"> Yellow</label>
    <label><input type="checkbox"> Turquoise Blue</label>
    <label><input type="checkbox"> Teal</label>
    <label><input type="checkbox"> Taupe</label>
    <label><input type="checkbox"> Tan</label>
    <label><input type="checkbox"> Skin</label>
    <label><input type="checkbox"> Silver</label>
    <label><input type="checkbox"> Sea Green</label>
    <label><input type="checkbox"> Rust</label>
    <label><input type="checkbox"> Rose</label>
    <label><input type="checkbox"> Red Purple</label>
    <label><input type="checkbox"> Pink</label>
    <label><input type="checkbox"> Peach</label>
    <label><input type="checkbox"> Orange</label>
    <label><input type="checkbox"> Off White</label>
    <label><input type="checkbox"> Olive</label>
    <label><input type="checkbox"> Nude</label>
    <label><input type="checkbox"> Mustard</label>
    <label><input type="checkbox"> Mushroom Brown</label>
  </div>

  <!-- Material -->
  <div class="filter-section">
    <strong>Material:</strong>
    <label><input type="checkbox"> Cotton</label>
    <label><input type="checkbox"> Polyester</label>
    <label><input type="checkbox"> Nylon</label>
    <label><input type="checkbox"> Linen</label>
    <label><input type="checkbox"> Poly-Cotton</label>
  </div>

</div>

<div class="btn-container">
  <button id="backBtn">Back</button>
  <button id="saveBtn">Save</button>
</div>

<div class="success-message" id="successMessage">
  Save Successful!
</div>

<script>
  document.getElementById('saveBtn').addEventListener('click', function () {
    const successMessage = document.getElementById('successMessage');
    successMessage.classList.add('show');
    setTimeout(function () {
      successMessage.classList.remove('show');
    }, 2000);
  });
  document.getElementById('backBtn').addEventListener('click', function() {
    if (document.referrer && !document.referrer.includes('Searchbar_filter.html')) {
      window.history.back();
    } else {
      window.location.href = "{{ url_for('Menu') }}";
    }
  });
</script>

</body>
</html>
