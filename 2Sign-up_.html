<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MajestiVision Sign-Up Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f5f0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .logo {
      width: 40%;
      text-align: center;
    }

    .logo img {
      width: 80%;
    }

    .form-container {
      width: 40%;
      background-color: #f9f5f0;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #5a4012;
      font-size: 24px;
      text-decoration: underline;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      position: relative;
    }

    label {
      display: block;
      font-size: 14px;
      color: #5a4012;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px 35px 10px 10px;
      border: 1px solid #5a4012;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 34px;
      width: 20px;
      height: 20px;
      background: url('https://www.svgrepo.com/show/532400/eye.svg') no-repeat center;
      background-size: contain;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-create {
      background-color: #add8e6;
      color: black;
      margin-bottom: 10px;
    }

    .btn-create:hover {
      background-color: #9ac7e0;
    }

    .google-btn {
      background-color: white;
      color: black;
      border: 1px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 5px;
    }

    .google-btn img {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }

    .or-text {
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
      color: #5a4012;
    }

    .form-container a {
      color: #5a4012;
      text-decoration: none;
      font-size: 12px;
      text-align: center;
      display: block;
      margin-top: 15px;
    }

    .error {
      color: red;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/MajestiVision logo.jpeg') }}" alt="MajestiVision_logo">
    </div>
    <div class="form-container">
      <h2>Create your account</h2>
      <form onsubmit="return handleSignup(event)">
        <div class="form-group">
          <label for="first-name">First Name:</label>
          <input type="text" id="first-name" name="first-name" placeholder="Enter your first name" required />
        </div>

        <div class="form-group">
          <label for="last-name">Last Name:</label>
          <input type="text" id="last-name" name="last-name" placeholder="Enter your last name" required />
        </div>

        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required />
          <span class="toggle-password" onclick="togglePassword(this, 'password')"></span>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password:</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required />
          <span class="toggle-password" onclick="togglePassword(this, 'confirm-password')"></span>
        </div>

        <div class="error" id="error-msg"></div>

        <button type="submit" class="btn btn-create">Create</button>

        <div class="or-text">OR</div>
        <a href="{{ url_for('login_google') }}" class="google-btn">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" />
          Login with Google
        </a>
        <a href="{{ url_for('login') }}" >Already have an account? Login</a>
      </form>
    </div>
  </div>

  <script>
    function togglePassword(icon, fieldId) {
      const input = document.getElementById(fieldId);
      const isText = input.type === "text";
      input.type = isText ? "password" : "text";
      icon.style.backgroundImage = isText
        ? "url('https://www.svgrepo.com/show/532400/eye.svg')"
        : "url('https://www.svgrepo.com/show/532401/eye-off.svg')";
    }

    function validatePassword(password) {
      const minLength = 8;
      const hasUppercase = /[A-Z]/.test(password);
      const hasLowercase = /[a-z]/.test(password);
      const hasDigit = /\d/.test(password);

      if (password.length < minLength) return `Password must be at least ${minLength} characters.`;
      if (!hasUppercase) return 'Password must contain at least one uppercase letter.';
      if (!hasLowercase) return 'Password must contain at least one lowercase letter.';
      if (!hasDigit) return 'Password must contain at least one number.';
      return '';
    }

    function handleSignup(e) {
      e.preventDefault();
      const firstName = document.getElementById("first-name").value.trim();
      const lastName = document.getElementById("last-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const errorMsg = document.getElementById("error-msg");

      errorMsg.textContent = '';

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match.";
        return false;
      }

      const passwordError = validatePassword(password);
      if (passwordError) {
        errorMsg.textContent = passwordError;
        return false;
      }

      const user = { firstName, lastName, email, password };
      localStorage.setItem("majestiUser", JSON.stringify(user));
      alert("Account created successfully!");
      window.location.href = "{{ url_for('login') }}";
      return true;
    }
  </script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const userJSON = localStorage.getItem('majestiUser');
      if (userJSON) {
        const user = JSON.parse(userJSON);
        const usernameInput = document.querySelector('input[name="username"]');
        const emailInput = document.querySelector('input[name="email"]');
        const passwordInput = document.querySelector('input[name="password"]');
        if (usernameInput) usernameInput.value = user.firstName + ' ' + user.lastName;
        if (emailInput) emailInput.value = user.email;
        if (passwordInput) passwordInput.value = user.password;
      }
    });
  </script>
</body>
</html>
