<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay Example</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6); /* translucent grey */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .overlay-text {
      font-size: 36px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="overlay-text">Calculating size...</div>
  </div>

</body>
</html>
