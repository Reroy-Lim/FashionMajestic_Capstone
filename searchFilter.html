<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Filters</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #d2d2d2b7;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    .filters-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .filter-section,
    .price-range {
      flex: 1 1 calc(33.333% - 30px);
      max-width: calc(33.333% - 30px);
      border: 2px solid black;
      border-radius: 10px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      box-sizing: border-box;
      text-align: left;
      background-color: white;
    }

    .filter-section strong,
    .price-range strong {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .filter-section label,
    .rating-stars label {
      display: flex;
      align-items: center;
      margin: 6px 0;
      font-size: 15px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }

    select {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .rating-stars .star {
      color: gold;
      margin-right: 5px;
      font-size: 16px;
    }

    .rating-stars label {
      justify-content: space-between;
    }

    .btn-container {
      margin-top: 30px;
    }

    button {
      background-color: #5d84c4;
      color: rgb(224, 217, 217);
      font-size: 18px;
      padding: 10px 30px;
      border: none;
      border-radius: 5px;
      margin: 0 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3e65a0;
    }

    .success-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #4CAF50;
      color: white;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .success-message.show {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body>

<h1>Search Filters</h1>

<form action="/shop/{{ menu_type }}" method="POST" style="all: unset !important; ">

    <div class="filters-wrapper">

      <!-- Type of Clothing -->
      <!-- <div class="filter-section">
        <strong>Type of Clothing:</strong>
        <label><input type="checkbox" id="subCategory1" name="subCategory" value="Topwear"> Topwear</label>
        <label><input type="checkbox" id="subCategory2" name="subCategory" value="Dress"> Dress</label>
        <label><input type="checkbox" id="subCategory3" name="subCategory" value="Bottomwear"> Bottomwear</label>
        <label><input type="checkbox" id="subCategory4" name="subCategory" value="Loungewear and Nightwear"> Lounge & Nightwear</label>
        <label><input type="checkbox" id="subCategory5" name="subCategory" value="Innerwear"> Innerwear</label>
        <label><input type="checkbox" id="subCategory6" name="subCategory" value="Saree"> Saree</label>
        <label><input type="checkbox" id="subCategory7" name="subCategory" value="Apparel Set"> Apparel Set</label>
        <label><input type="checkbox" id="subCategory8" name="subCategory" value="Socks"> Socks</label>
      </div> -->
      <div class="filter-section">
        <strong>Gender:</strong>
              <label><input type="checkbox" name="gender" value="Men"> Men</label>
              <label><input type="checkbox" name="gender" value="Women"> Women</label>
              <label><input type="checkbox" name="gender" value="Boys"> Boys</label>
              <label><input type="checkbox" name="gender" value="Girls"> Girls</label>
              <label><input type="checkbox" name="gender" value="Unisex"> Unisex</label>
      </div>
      <!-- Made In -->
      <div class="filter-section">
        <strong>Made in:</strong>
              <label><input type="checkbox" name="Made In" value="Singapore"> Singapore</label>
              <label><input type="checkbox" name="Made In" value="USA"> United States</label>
              <label><input type="checkbox" name="Made In" value="UK"> United Kingdom</label>
              <label><input type="checkbox" name="Made In" value="Vietnam"> Vietnam</label>
              <label><input type="checkbox" name="Made In" value="China"> China</label>
      </div>

      <!-- Price Range -->
<!-- Price Range -->
<div class="price-range">
  <strong>Price Range:</strong>
  <label for="min-price">Min Price:</label>
  <select id="min-price" name="min_price">
    <option value="30">$30</option>
    <option value="50">$50</option>
    <option value="100">$100</option>
    <option value="150">$150</option>
  </select>
    <label for="max-price">Max Price:</label>
      <select id="max-price" name="max_price">
        <option value="150">$150</option>
        <option value="200">$200</option>
        <option value="250">$250</option>
        <option value="300">$300</option>
      </select>
    </div>


      <!-- Ratings -->
    <div class="filter-section">
      <strong>Ratings:</strong>
      <label><input type="checkbox" name="rating" value="5"> <span class="star">⭐⭐⭐⭐⭐</span></label>
      <label><input type="checkbox" name="rating" value="4"> <span class="star">⭐⭐⭐⭐</span></label>
      <label><input type="checkbox" name="rating" value="3"> <span class="star">⭐⭐⭐</span></label>
      <label><input type="checkbox" name="rating" value="2"> <span class="star">⭐⭐</span></label>
      <label><input type="checkbox" name="rating" value="1"> <span class="star">⭐</span></label>
    </div>

      <!-- Color -->
      <div class="filter-section">
        <strong>Color:</strong>
        <label><input type="checkbox" id="baseColour1" name="baseColour" value="Beige"> Beige</label>
        <label><input type="checkbox" id="baseColour2" name="baseColour" value="Black"> Black</label>
        <label><input type="checkbox" id="baseColour3" name="baseColour" value="Blue"> Blue</label>
        <label><input type="checkbox" id="baseColour4" name="baseColour" value="Brown"> Brown</label>
        <label><input type="checkbox" id="baseColour7" name="baseColour" value="Grey"> Grey</label>
        <label><input type="checkbox" id="baseColour8" name="baseColour" value="Green"> Green</label>
        <label><input type="checkbox" id="baseColour9" name="baseColour" value="Purple"> Purple</label>
        <label><input type="checkbox" id="baseColour10" name="baseColour" value="White"> White</label>
        <label><input type="checkbox" id="baseColour13" name="baseColour" value="Cream"> Cream</label>
        <label><input type="checkbox" id="baseColour20" name="baseColour" value="Maroon"> Maroon</label>
        <label><input type="checkbox" id="baseColour22" name="baseColour" value="Multi"> Multi</label>
        <label><input type="checkbox" id="baseColour23" name="baseColour" value="Yellow"> Yellow</label>        
        <label><input type="checkbox" id="baseColour34" name="baseColour" value="Pink"> Pink</label>
        <label><input type="checkbox" id="baseColour35" name="baseColour" value="Peach"> Peach</label>
        <label><input type="checkbox" id="baseColour36" name="baseColour" value="Orange"> Orange</label>
        <label><input type="checkbox" id="baseColour38" name="baseColour" value="Olive"> Olive</label>        
      </div>


      <!-- Material -->
    <div class="filter-section">
      <strong>Material:</strong>
      <label><input name="Material" type="checkbox" value="Cotton"> Cotton</label>
      <label><input name="Material" type="checkbox" value="Polyester"> Polyester</label>
      <label><input name="Material" type="checkbox" value="Nylon"> Nylon</label>
      <label><input name="Material" type="checkbox" value="Linen"> Linen</label>
      <label><input name="Material" type="checkbox" value="Poly-Cotton"> Poly-Cotton</label>
      <label><input name="Material" type="checkbox" value="Wool"> Wool</label>
    </div>
  </div>
    </div>
    <div class="btn-container">
      <a href="/shop/{{ menu_type if menu_type else 'menu' }}"
      onclick="event.preventDefault(); 
                const fallback = '/shop/menu';
                if (history.length > 1) {
                  history.back();
                } else {
                  window.location.href = fallback;
                }">
      <button id="backBtn" type="button">← Back</button>
    </a>


      <button id="saveBtn" type="submit">Save</button>
    </div>
</form>

</body>
</html>
