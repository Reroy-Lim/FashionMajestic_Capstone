<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MajestiVision - Profile Settings</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      color: #333;
      overflow-x: auto;
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .container {
      display: grid;
      grid-template-columns: 350px 1fr 500px;
      gap: 40px;
      padding: 100px 40px 40px;
      min-width: 1200px;
    }

    /* Sidebar */
    .sidebar {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      height: fit-content;
      position: sticky;
      top: 80px;
    }

    .sidebar-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 25px;
      text-align: center;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar-item {
      padding: 15px 20px;
      border-radius: 12px;
      font-weight: 500;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      border: 2px solid transparent;
    }

    .sidebar-item:hover {
      background: #f7fafc;
      border-color: #e2e8f0;
      transform: translateX(5px);
    }

    .sidebar-item.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    /* Profile Section */
    .profile-section {
      background: white;
      border-radius: 20px;
      padding: 60px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .user-avatar {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .user-avatar svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    .profile-title {
      font-size: 2rem;
      font-weight: 600;
      color: #2d3748;
    }

    .profile-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-input {
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      background: #f8fafc;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .update-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      align-self: center;
      width: 50%;
    }

    .update-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* Fashion Background */
    .fashion-background {
      background: url('data:image/svg+xml;base64,...') center/cover;
      height: 700px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .fashion-items {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.15;
    }

    .fashion-item {
      position: absolute;
      border-radius: 10px;
      animation: float 6s ease-in-out infinite;
    }

    .fashion-item:nth-child(1) { width: 60px; height: 60px; background: #ff6b9d; top: 10%; left: 10%; animation-delay: 0s; }
    .fashion-item:nth-child(2) { width: 80px; height: 80px; background: #45b7d1; top: 20%; right: 15%; animation-delay: 1s; }
    .fashion-item:nth-child(3) { width: 50px; height: 50px; background: #96ceb4; bottom: 30%; left: 20%; animation-delay: 2s; }
    .fashion-item:nth-child(4) { width: 70px; height: 70px; background: #feca57; bottom: 20%; right: 10%; animation-delay: 3s; }
    .fashion-item:nth-child(5) { width: 40px; height: 40px; background: #ff9ff3; top: 50%; right: 40%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @media (max-width: 1200px) {
      .container {
        grid-template-columns: 1fr;
        padding: 40px 20px;
      }
      .profile-section, .sidebar, .fashion-background {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<button class="back-button" onclick="window.location.href='/menu'">← Back to Menu</button>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h3 class="sidebar-title">Settings Menu</h3>
    <div class="sidebar-menu">
      <div class="sidebar-item active" data-section="profile">Update/View Profile</div>
      <div class="sidebar-item" data-section="measurements">Measurements</div>
      <div class="sidebar-item" data-section="settings">Cart</div>
    </div>
  </div>

  <!-- Profile Section -->
  <div class="profile-section">
    <div class="profile-header">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <h2 class="profile-title">Profile Settings</h2>
    </div>

    <form class="profile-form" id="profileForm">
      <div class="form-group">
        <input type="text" name="username" placeholder="Username" class="form-input" required />
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="Email" class="form-input" required />
      </div>
      <div class="form-group">
        <input type="tel" name="phone" placeholder="Phone No." class="form-input" pattern="[0-9+\s-]+" />
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Password" class="form-input" required />
      </div>
      <button type="submit" class="update-btn">Update Info</button>
    </form>
  </div>

  <!-- Fashion Decoration -->
  <div class="fashion-background">
    <div class="fashion-items">
      <div class="fashion-item"></div>
      <div class="fashion-item"></div>
      <div class="fashion-item"></div>
      <div class="fashion-item"></div>
      <div class="fashion-item"></div>
    </div>
  </div>
</div>

<script>
  // Pre-fill profile form with stored sign-up info
  window.addEventListener('DOMContentLoaded', () => {
    const userJSON = localStorage.getItem('majestiUser');
    if (userJSON) {
      const user = JSON.parse(userJSON);
      
      const usernameInput = document.querySelector('input[name="username"]');
      const emailInput = document.querySelector('input[name="email"]');
      const passwordInput = document.querySelector('input[name="password"]');
      
      if (usernameInput) usernameInput.value = user.firstName + ' ' + user.lastName;
      if (emailInput) emailInput.value = user.email;
      if (passwordInput) passwordInput.value = user.password;
    }
  });

  // Submit profile update form handler
  document.getElementById('profileForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.querySelector('.update-btn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => {
      btn.style.transform = 'scale(1)';
      alert('Profile updated successfully!');
    }, 150);
  });

  // Sidebar navigation
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', function() {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
      const section = this.getAttribute('data-section');
      if (section === 'measurements') window.location.href = '/Settings_measurements';
      else if (section === 'profile') window.location.href = '/Settings_Page';
      else if (section === 'settings') window.location.href = '/Settings_Cart';
    });
  });
</script>

</body>
</html>
